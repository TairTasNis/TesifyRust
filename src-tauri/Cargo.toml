[package]
name = "tesify"
version = "1.2.3"
description = "Tesify desktop app"
authors = ["Tesify"]
edition = "2021"
build = "build.rs"
default-run = "tesify"

[lib]
name = "tesify_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tesify"
path = "src/main.rs"

[[bin]]
name = "tesify-backend"
path = "src/bin/backend.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
dotenvy = "0.15"
futures-util = "0.3"
mime_guess = "2"
parking_lot = "0.12"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["brotli", "deflate", "gzip", "json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["cors"] }
urlencoding = "2"
